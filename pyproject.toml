[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "investing-engine"
version = "2.0.0"
description = "MCP-native multi-agent market analysis engine for Borsa Istanbul, built on LangGraph."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Muhammet Ali Varlik" }]
requires-python = ">=3.10"
dependencies = [
    "cachetools==7.1.7",
    "fastapi==0.142.2",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "joblib==1.5.3",
    "langchain==1.4.3",
    "langchain-core==1.6.6",
    "langchain-groq==1.1.3",
    "langchain-mcp-adapters==0.3.2",
    "langchain-ollama==1.1.0",
    "langgraph==1.2.12",
    "langgraph-supervisor==0.0.31",
    "mcp==1.30.0",
    "matplotlib==3.10.9",
    "numpy==2.2.6",
    "pandas==2.3.3",
    "pillow==12.3.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "pypdf==6.19.0",
    "pypdfium2==5.13.0",
    "pytesseract==0.3.13",
    "python-dotenv==1.0.1",
    "python-multipart==0.0.32",
    "scikit-learn==1.7.2",
    "ta==0.11.0",
    "uvicorn==0.34.0",
    "weasyprint==70.0",
]

[project.optional-dependencies]
# Yahoo Finance access is for local, personal use only and is never enabled
# in a deployed build - see DATA_SOURCES.md.
local = ["yfinance==1.6.0"]
# Langfuse tracing; enabled at runtime only when LANGFUSE_* keys are set.
observability = ["langfuse==4.16.0"]
dev = [
    "mypy==2.3.1",
    "pandas-stubs",
    "pre-commit",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-mock==3.15.1",
    "respx==0.23.1",
    "ruff==0.16.10",
    "types-cachetools",
]

[project.scripts]
investing-engine-mcp = "investing_engine.mcp_server.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
investing_engine = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:ta.*",
    # Raised inside langgraph_supervisor itself, not by this project's code.
    "ignore:create_react_agent has been moved:DeprecationWarning:langgraph_supervisor.*",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "N", "RUF", "ASYNC", "PT"]
ignore = [
    "S101",   # assert is idiomatic in pytest
    "N803",   # pandas OHLCV column names (Open, High, ...) are conventional
    "N806",
    "RUF001", # Turkish characters and currency symbols in strings are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S104", "S105", "S106", "S311"]
# Regex pattern table is kept one pattern per line for reviewability.
"src/investing_engine/guardrails/injection.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["investing_engine"]
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_decorators = false
disallow_subclassing_any = false

[tool.coverage.run]
source = ["investing_engine"]
branch = true
