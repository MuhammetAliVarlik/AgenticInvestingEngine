# Local stack.
#   Hosted LLM (Groq):  docker compose up --build
#   Local LLM (Ollama): docker compose --profile ollama up --build
#                       (set LLM_PROVIDER=ollama and OLLAMA_BASE_URL=http://ollama:11434 in .env)
#
# Every published port is bound to 127.0.0.1. Ollama publishes no port at all:
# only the API can reach it, over the private "llm" network.

services:
  api:
    build: .
    env_file: .env
    environment:
      DB_PATH: /data/predictions.db
      MODEL_DIR: /data/models
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8080:8000"
    networks: [backend, llm]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped

  ui:
    build: ./ui
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "127.0.0.1:8501:8501"
    networks: [backend]
    depends_on: [api]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped

  ollama:
    profiles: [ollama]
    build: ./ollama
    entrypoint: ["/bin/bash", "/pull-llama3.sh"]
    volumes:
      - ollama:/ollama
    environment:
      OLLAMA_MODELS: /ollama
    networks: [llm]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  backend:
  llm:

volumes:
  ollama:
