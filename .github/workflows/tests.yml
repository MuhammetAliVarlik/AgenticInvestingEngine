name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system packages (OCR, PDF rendering)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-tur \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core

      - name: Install
        run: |
          # The runner image ships an older setuptools that pip-audit flags.
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev,observability]" -r ui/requirements.txt

      - name: Lint
        run: |
          ruff check src tests scripts ui
          ruff format --check src tests scripts ui

      - name: Type-check
        run: mypy

      - name: Test
        run: pytest --cov --cov-report=term-missing

      - name: Audit dependencies
        run: |
          pip install pip-audit
          pip-audit --skip-editable

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Type-check and build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high
